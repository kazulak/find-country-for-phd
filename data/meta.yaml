# Written by `npm run data:refresh`. Do not edit by hand.
# Manually researched figures (pay, fees, visas) are documented in docs/DATA_SOURCES.md.
refreshed: '2026-10-01'
automated_sources:
  price_level_index:
    source: 'Eurostat, prc_ppp_ind: price level index, household final consumption (EU27_2020 = 100)'
    year: 2024
    url: https://ec.europa.eu/eurostat/databrowser/view/prc_ppp_ind/default/table
  life_satisfaction:
    source: World Happiness Report (Cantril ladder, 0-10), via Our World in Data
    year: 2025
    url: https://ourworldindata.org/grapher/happiness-cantril-ladder
  climate:
    source: 'Open-Meteo historical weather API (ERA5 reanalysis): mean daily temperature in the capital, January and July'
    period: 2016–2025
    url: https://open-meteo.com/en/docs/historical-weather-api
  pay_deductions:
    source: >-
      OECD Taxing Wages: income tax + employee social security contributions, % of gross wage, single person without
      children at 67% of the average wage (taxed salaries only)
    year: 2025
    url: https://data-explorer.oecd.org/vis?df%5Bag%5D=OECD.CTP.TPS&df%5Bid%5D=DSD_TAX_WAGES_COMP%40DF_TW_COMP
  exchange_rates:
    source: European Central Bank euro reference rates, annual average (units per 1 EUR)
    year: 2025
    url: https://data.ecb.europa.eu/data/datasets/EXR
    rates:
      CHF: 0.937
      CZK: 24.6879
      DKK: 7.4634
      GBP: 0.8568
      HUF: 397.7675
      NOK: 11.7173
      PLN: 4.2397
      RON: 5.0424
      SEK: 11.0663
