description:
  overview: Funded PhD candidates are usually employed on a three-year contrat doctoral. The statutory minimum is EUR 2,300 gross/month from January 2026, with health, unemployment and pension cover. CIFRE industry PhDs and some institutes pay more.
  pros:
    - Standardized employee contract with full worker rights.
    - Low tuition fees at public universities.
  cons:
    - Complex administration bureaucracy (often in French only).
    - High rents in Paris and large university cities.
