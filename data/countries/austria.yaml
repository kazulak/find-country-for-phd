description:
  overview: PhD candidates are usually employed as university assistants (prae doc) under the universities collective agreement. Group B1 pays EUR 3,776.10 gross/month full-time (2026), and most PhD posts are 30 hours/week (75%), paid 14 times a year. Some STEM positions are full-time.
  pros:
    - Full employee status with 14 salary payouts per year.
    - Strong academic networks and high quality of life.
  cons:
    - Rents are rising in Vienna and Innsbruck.
    - Requires teaching contributions in local languages.
