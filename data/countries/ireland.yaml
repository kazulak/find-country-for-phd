description:
  overview: Most funded PhDs are tax-free stipends rather than jobs. The Research Ireland stipend rose to EUR 25,000/year from January 2025, with fees usually paid separately. Dublin rents are among the highest in the EU, so location matters a lot.
  pros:
    - Stipend is completely tax-free.
    - Excellent tech and biotech post-PhD industry connections.
  cons:
    - Dublin rental costs can exceed the entire stipend.
    - No pension contributions or standard employee contract protections.
