description:
  overview: Doctoral candidates are employees of the University of Luxembourg or a research institute, often funded by the FNR. 2026 job ads list a yearly gross salary of about EUR 43,400 full-time, indexed to the national salary index. Housing is expensive.
  pros:
    - High salaries by European standards, with full pension accrual.
    - Highly international, multilingual research labs.
  cons:
    - Rents are extremely high and finding housing is difficult.
    - Limited local student life outside the university town of Belval.
