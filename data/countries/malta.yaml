description:
  overview: Most funded PhDs in Malta are project posts at the University of Malta (for example Research Support Officer II, about EUR 28,800/year from 2024). The national TESS scheme covers tuition and at most EUR 2,500/year of maintenance, so it is not a full stipend on its own.
  pros:
    - English is an official language, making integration immediate.
    - Tax-free stipend status.
  cons:
    - Stipend is low relative to rising rental costs in expat hubs.
    - Limited research funding for large lab materials.
