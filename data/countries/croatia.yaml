description:
  overview: PhD researchers are typically employed as assistants (asistent), often on Croatian Science Foundation (HRZZ) projects. Pay is the job coefficient (2.01) times the public-sector salary base (EUR 1,025 from August 2026), about EUR 2,060 gross or EUR 1,430 net per month, with full social security.
  pros:
    - Full employee rights, including health cover and pension accrual.
    - Low cost of living in historical coastal/academic cities.
  cons:
    - Low salary scale relative to Western European averages.
    - Highly document-heavy public administration and language barrier.
