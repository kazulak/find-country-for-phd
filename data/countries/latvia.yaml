description:
  overview: 'Latvia reformed doctoral studies in 2024: candidates admitted to state-funded places from 2024/25 are employed with a state salary of at least EUR 1,000/month, which universities can top up from projects. Earlier cohorts finish under the old scholarship rules until the end of 2026.'
  pros:
    - Low cost of living and affordable student accommodation.
    - Beautiful nature and Baltic coastal access.
  cons:
    - Base state stipend alone is not survivable.
    - Limited funding for humanities and social sciences.
