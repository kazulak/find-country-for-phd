description:
  overview: Most funded PhDs are tax-free stipends rather than jobs. The UKRI minimum stipend for 2026/27 is GBP 21,805/year (plus GBP 2,000 London weighting), with fees paid separately. Stipends do not build up a pension or National Insurance record.
  pros:
    - Stipend is 100% tax-free.
    - Opportunity for industry-sponsored CASE top-ups.
  cons:
    - No social security benefits, paid parental leave, or pension accrual.
    - Dublin-equivalent severe rental crisis in major university cities.
