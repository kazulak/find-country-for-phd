description:
  overview: Doctoral candidates are employed by their university or institute. The Swiss National Science Foundation raised its minimum doctoral salary to CHF 50,000/year from January 2026 (range CHF 50,000-55,000); ETH Zurich, EPFL and some universities set their own, often higher, scales. Living costs are the highest in Europe.
  pros:
    - Highest nominal PhD salaries in Europe.
    - World-renowned research labs and infrastructure (ETH/EPFL).
  cons:
    - Extremely high cost of living (rent, groceries, health insurance).
    - Strict immigration quotas for non-EU/EFTA graduates.
