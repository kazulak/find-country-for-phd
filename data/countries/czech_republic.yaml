description:
  overview: A 2025 reform guarantees new doctoral students a minimum doctoral income of 1.2x the minimum wage (CZK 26,880/month from 2026/27), paid as a tax-free stipend, a salary from a project or university, or a mix. Many students combine both.
  pros:
    - Low tuition fees and very affordable dormitory housing.
    - Prague is a highly attractive, central European city.
  cons:
    - Base state stipend is too low without university top-ups.
    - Strict predoctoral milestones before completing studies.
