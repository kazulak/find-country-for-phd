description:
  overview: Many PhD candidates hold doctoral fellowships rather than employment contracts. A Flemish FWO PhD fellowship pays at least EUR 2,600/month net (tax-free, indexed), with social security coverage. University-funded and French-community scholarships follow similar scales.
  pros:
    - High tax-free net stipend with basic health insurance.
    - Excellent research groups and central European location.
  cons:
    - No standard pension contributions during the fellowship.
    - Complex regional university administrations (Flanders vs. Wallonia).
