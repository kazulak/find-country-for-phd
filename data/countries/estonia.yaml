description:
  overview: Since 2022 doctoral candidates are employed as junior research fellows with full employee rights. The minimum full-time salary is EUR 2,100 gross/month from April 2026, and income tax is relatively low.
  pros:
    - Highly digitalized, paperless university administration.
    - Full employee status with standard health cover and pension.
  cons:
    - Winters are long, dark, and cold.
    - Relatively high rental costs in Tallinn and Tartu.
