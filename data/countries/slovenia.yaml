description:
  overview: Most doctoral researchers are employed through the national 'young researcher' (mladi raziskovalec) programme on four-year contracts, paid in public-sector salary grade 22 (about EUR 2,330 gross/month in 2026), plus meal and travel allowances.
  pros:
    - Full employee status with pension, travel, and lunch allowances.
    - Clean, safe, and beautiful alpine nature.
  cons:
    - Limited number of Young Researcher slots available annually.
    - Language barrier for teaching and local administration.
