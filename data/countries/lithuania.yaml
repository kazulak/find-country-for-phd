description:
  overview: 'State-funded doctoral students receive a tax-free scholarship linked to the basic social benefit: 19 x BSI (EUR 1,406/month) in year 1 and about EUR 1,628 in later years (2026), plus a yearly allowance from the doctoral fund.'
  pros:
    - Scholarship is completely tax-free.
    - Low cost of living and modern digital infrastructure.
  cons:
    - No standard pension accrual or employee contract rights.
    - Language barrier in municipal and off-campus offices.
