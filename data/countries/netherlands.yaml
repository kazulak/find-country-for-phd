description:
  overview: PhD candidates are salaried employees under the Dutch university collective agreement (CAO NU). From July 2026 the scale starts at EUR 3,204 gross/month in year 1 and rises to about EUR 4,050 by year 4, plus an 8% holiday allowance and an 8.3% year-end bonus, with full pension accrual.
  pros:
    - Highest standard employee salaries and holiday/end-year bonuses.
    - Outstanding university support networks and high English proficiency.
  cons:
    - Severe national housing shortage with high rent.
    - High cost of daily living and services in academic hubs.
