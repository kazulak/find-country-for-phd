description:
  overview: PhD research fellows (stipendiat, code 1017) are public employees. Universities such as NTNU and UiO advertise NOK 550,800 gross/year in 2026; the central minimum was removed from the state agreement in May 2026, so salaries are now set per university. Full employee benefits and state pension apply.
  pros:
    - Excellent starting salary with full public servant benefits.
    - Exceptional work-life balance and generous parental leave.
  cons:
    - Very high cost of living, especially for services and eating out.
    - Highly competitive application process.
