description:
  overview: Doctoral researchers are employed by the university under the national university salary system (job requirement levels 2-4 plus a personal performance component). Starting salaries in 2026 ads are around EUR 2,500-2,800 gross/month at most universities, and higher at Aalto. Employment includes occupational health care and pension accrual.
  pros:
    - Salaried contract with full pension and social security.
    - Excellent work-life balance and pristine nature.
  cons:
    - Cold, dark winters.
    - High tax rates on salaries.
