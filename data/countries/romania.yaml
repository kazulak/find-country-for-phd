description:
  overview: State-funded full-time doctoral students receive a monthly scholarship of RON 3,700 (2025-2026, unchanged in 2026), regardless of year of study. Research grants can add to it.
  pros:
    - Low cost of daily living and housing.
    - Fast-growing IT and tech hubs in Cluj and Bucharest.
  cons:
    - Base state stipend is very low.
    - Heavy reliance on project-based top-ups which vary between labs.
