description:
  overview: PhD fellows are salaried employees under the AC collective agreement. In 2026 the first-year pay is about DKK 31,800/month (base pay plus a PhD supplement), plus a 17.1% employer pension contribution on top. Taxes are high, but so is the starting point.
  pros:
    - High net starting salaries and excellent pension schemes.
    - Very flat hierarchy and high work autonomy.
  cons:
    - High personal income taxes.
    - Very high cost of living and housing shortages in Copenhagen.
