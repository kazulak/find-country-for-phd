description:
  overview: Poland pays doctoral-school stipends in two tiers. Before the mid-term evaluation (roughly years 1-2) the statutory minimum is 37% of the professor base salary, PLN 3,570.50 gross/month in 2026 (about EUR 840). After a successful evaluation it rises to 57%, PLN 5,500.50 gross/month (about EUR 1,300). Many universities pay above the minimum (e.g. PLN 4,700 before the evaluation at Wrocław University of Science and Technology). Stipends are free of income tax, but pension and disability contributions (about 11%) are deducted.
  pros:
    - Stipend increases significantly after the 2-year mid-term evaluation.
    - No tuition fees for doctoral school programs.
  cons:
    - 'The first-two-years stipend is very low: hard to live on without savings, a side job or a university top-up, especially in Warsaw or Kraków.'
    - Subject to social security pension deductions since 2019 reform.
