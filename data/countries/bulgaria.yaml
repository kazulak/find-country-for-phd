description:
  overview: State-funded full-time doctoral students receive a monthly scholarship, raised to BGN 1,562 (about EUR 799) from October 2025; Bulgaria adopted the euro in January 2026. Living costs, especially outside Sofia, are among the lowest in the EU.
  pros:
    - Very low cost of daily living and services.
    - Cheap student dormitory options.
  cons:
    - Lowest base PhD salary in the EU.
    - Heavy administrative requirements and high language barrier.
